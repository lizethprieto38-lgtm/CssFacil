<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Box Model - CSS</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <!-- Estilos personalizados -->
    <style>
        .caja1 {
            min-height: 100px;
            background-color: #8E4778;
        }

        .caja2 {
            height: 300px;
            background-color: #9134B5;
        }

        .caja3 {
            height: 300px;
            background-color: #351B80;
        }

        .caja4 {
            height: 300px;
            background-color: #5261B8;
        }

        .caja5 {
            height: 300px;
            background-color: #3479B5;
        }

        .caja6 {
            height: 300px;
            background-color: #C02C91;
        }

        .caja7 {
            height: 300px;
            background-color: #772B9E;
        }

        .caja8 {
            height: 300px;
            background-color: #7044C4;
        }

        .caja9 {
            height: 300px;
            background-color: #4655A0;
        }

        .caja10 {
            height: 300px;
            background-color: #286A99;
        }

        .icono {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #fff;
        }
    </style>
</head>

<body>

    <div class="container-fluid">
        <div class="row">

            <!-- CAJA 1 -->
            <div class="col-12 caja1 d-flex justify-content-center align-items-center">
                <h2 class="text-white text-center">Box Model</h2>
            </div>

            <!-- CAJA 2 -->
            <div class="col-12 caja2"></div>

            <!-- CAJAS 3, 4 Y 5 -->
            <div class="col-12 col-sm-12 col-md-4 col-lg-4 col-xl-4 caja3 p-4 text-white"></div>

            <div class="col-12 col-sm-12 col-md-6 col-lg-6 col-xl-3 caja6 p-3 text-white"></div>

            <div class="col-12 col-sm-12 col-md-4 col-lg-4 col-xl-2 caja8 p-3 text-white"></div>

</html>
